{% extends "base.html" %}
{% load bootstrap4 %}

{% block content %}
<h4>Enter your new password</h4>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {% bootstrap_form form %}
        <button type="submit" class="btn btn-primary">
            Set password
        </button>
    </form>
{% else %}
    <div class="alert alert-danger">
        This password reset link is invalid or has expired.
        Please request a new password reset.
    </div>
{% endif %}

{% endblock %}
